# -----------------------------------------------------------------------------
# Shared WordPress settings
# -----------------------------------------------------------------------------
wp_site_title: "Tina's WordPress Lab"
wp_site_url: "https://{{ ansible_host }}"

wp_admin_user: "wpadmin"
wp_admin_password: "HArrY!21%"
wp_admin_email: "tking2524@student.bmcc.edu"

# Database settings
wp_db_name: "wordpress"
wp_db_user: "wordpress"
wp_db_password: "HarrY!21%"
wp_db_host: "localhost"

# WordPress application settings
wp_system_user: "wordpress"
wp_root: "/var/www/wordpress"
wp_cli_path: "/usr/local/bin/wp"

# Plugins required on both systems
wp_plugins:
  - akismet
  - wordpress-seo

# Common TLS locations used on both distributions
ssl_key_path: >-
  {{ '/etc/pki/tls/private/wordpress-lab.key'
     if ansible_os_family == 'RedHat'
     else '/etc/ssl/private/wordpress-lab.key' }}

ssl_cert_path: >-
  {{ '/etc/pki/tls/certs/wordpress-lab.crt'
     if ansible_os_family == 'RedHat'
     else '/etc/ssl/certs/wordpress-lab.crt' }}
ssl_days: 365


