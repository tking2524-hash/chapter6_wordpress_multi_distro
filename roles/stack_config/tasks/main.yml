---
# -----------------------------------------------------------------------------
# WordPress application account and document root
# -----------------------------------------------------------------------------
- name: Create WordPress application user
  ansible.builtin.user:
    name: "{{ wp_system_user }}"
    group: "{{ wp_web_group }}"
    home: "{{ wp_root }}"
    create_home: false
    shell: /sbin/nologin
    system: true

- name: Create WordPress document root
  ansible.builtin.file:
    path: "{{ wp_root }}"
    state: directory
    owner: "{{ wp_system_user }}"
    group: "{{ wp_web_group }}"
    mode: '0755'

# -----------------------------------------------------------------------------
# PHP-FPM configuration
# -----------------------------------------------------------------------------
- name: Configure PHP-FPM user
  ansible.builtin.lineinfile:
    path: "{{ php_fpm_pool_config }}"
    regexp: '^user ='
    line: "user = {{ wp_web_user }}"
  notify: Restart php-fpm

- name: Configure PHP-FPM group
  ansible.builtin.lineinfile:
    path: "{{ php_fpm_pool_config }}"
    regexp: '^group ='
    line: "group = {{ wp_web_group }}"
  notify: Restart php-fpm

- name: Configure PHP-FPM socket owner
  ansible.builtin.lineinfile:
    path: "{{ php_fpm_pool_config }}"
    regexp: '^;?listen.owner ='
    line: "listen.owner = {{ wp_web_user }}"
  notify: Restart php-fpm

- name: Configure PHP-FPM socket group
  ansible.builtin.lineinfile:
    path: "{{ php_fpm_pool_config }}"
    regexp: '^;?listen.group ='
    line: "listen.group = {{ wp_web_group }}"
  notify: Restart php-fpm

- name: Configure PHP-FPM socket permissions
  ansible.builtin.lineinfile:
    path: "{{ php_fpm_pool_config }}"
    regexp: '^;?listen.mode ='
    line: 'listen.mode = 0660'
  notify: Restart php-fpm

- name: Increase PHP CLI memory limit
  ansible.builtin.lineinfile:
    path: "{{ php_cli_ini }}"
    regexp: '^memory_limit\s*='
    line: 'memory_limit = 512M'
  notify: Restart php-fpm

- name: Increase PHP-FPM memory limit when configuration file differs
  ansible.builtin.lineinfile:
    path: "{{ php_fpm_ini }}"
    regexp: '^memory_limit\s*='
    line: 'memory_limit = 512M'
  notify: Restart php-fpm
  when: php_fpm_ini != php_cli_ini

# -----------------------------------------------------------------------------
# TLS certificate
# -----------------------------------------------------------------------------
- name: Create TLS certificate directory
  ansible.builtin.file:
    path: "{{ ssl_cert_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create TLS private key directory
  ansible.builtin.file:
    path: "{{ ssl_key_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Generate self-signed TLS certificate
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -nodes -newkey rsa:2048
      -days {{ ssl_days }}
      -keyout {{ ssl_key_path }}
      -out {{ ssl_cert_path }}
      -subj /CN={{ ansible_host | default(inventory_hostname) }}
    creates: "{{ ssl_cert_path }}"
  notify: Reload nginx

- name: Set TLS private key permissions
  ansible.builtin.file:
    path: "{{ ssl_key_path }}"
    owner: root
    group: root
    mode: '0600'

# -----------------------------------------------------------------------------
# NGINX configuration
# /etc/nginx/conf.d is included by NGINX on both target platforms.
# -----------------------------------------------------------------------------
- name: Deploy NGINX WordPress configuration
  ansible.builtin.template:
    src: wordpress-nginx.conf.j2
    dest: /etc/nginx/conf.d/wordpress.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

- name: Remove Red Hat default NGINX server configuration if present
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Reload nginx
  when: ansible_os_family == 'RedHat'

- name: Remove Debian default NGINX site if present
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
  when: ansible_os_family == 'Debian'

# -----------------------------------------------------------------------------
# Red Hat firewall and SELinux configuration
# -----------------------------------------------------------------------------
- name: Allow HTTP through firewalld on Red Hat
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled
  when: ansible_os_family == 'RedHat'

- name: Allow HTTPS through firewalld on Red Hat
  ansible.posix.firewalld:
    service: https
    permanent: true
    immediate: true
    state: enabled
  when: ansible_os_family == 'RedHat'

- name: Allow NGINX network connections through SELinux on Red Hat
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true
  when: ansible_os_family == 'RedHat'

- name: Set SELinux context on WordPress directory on Red Hat
  community.general.sefcontext:
    target: "{{ wp_root }}(/.*)?"
    setype: httpd_sys_rw_content_t
    state: present
  when: ansible_os_family == 'RedHat'

- name: Apply SELinux context to WordPress directory on Red Hat
  ansible.builtin.command:
    cmd: "restorecon -Rv {{ wp_root }}"
  register: restorecon_result
  changed_when: "'Relabeled' in restorecon_result.stdout"
  when: ansible_os_family == 'RedHat'

# -----------------------------------------------------------------------------
# Validation and services
# -----------------------------------------------------------------------------
- name: Test NGINX configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Ensure MariaDB is running
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Ensure PHP-FPM is running
  ansible.builtin.service:
    name: "{{ php_fpm_service }}"
    state: started
    enabled: true

- name: Ensure NGINX is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
